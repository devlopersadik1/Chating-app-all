<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset password — Talviro Chat</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6fb;color:#25243a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(100%,430px);background:#fff;padding:28px;border-radius:20px;box-shadow:0 12px 36px #25243a12}
    h1{font-size:26px;margin:0 0 8px}p{color:#626a80;line-height:1.5}
    label{display:block;font-size:14px;font-weight:600;margin:18px 0 7px}
    input{width:100%;padding:13px;border:1px solid #d7dbea;border-radius:10px;font:inherit}
    button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#5546c7;color:#fff;font:inherit;font-weight:700}
    button:disabled{opacity:.6}#message{margin-top:16px;font-size:14px;overflow-wrap:anywhere}.error{color:#b42332}.success{color:#23734d}
  </style>
</head>
<body>
<main>
  <h1>Reset your password</h1>
  <p>Choose a new password for your Talviro Chat account. The reset link expires after 30 minutes.</p>
  <form id="resetForm">
    <label for="password">New password</label>
    <input id="password" type="password" minlength="10" maxlength="72" autocomplete="new-password" required>
    <label for="confirm">Confirm new password</label>
    <input id="confirm" type="password" minlength="10" maxlength="72" autocomplete="new-password" required>
    <button id="submit" type="submit">Update password</button>
  </form>
  <div id="message" role="status" aria-live="polite"></div>
</main>
<script>
(() => {
  // Set this to the public HTTPS API base, including /api/v1.
  const API_BASE = "https://YOUR_DOMAIN.example/api/v1";
  const token = new URLSearchParams(window.location.search).get("token") || "";
  const form = document.getElementById("resetForm");
  const message = document.getElementById("message");
  const submit = document.getElementById("submit");
  const show = (text, kind) => { message.textContent = text; message.className = kind || ""; };
  if (!/^[a-f0-9]{64}$/i.test(token)) {
    form.hidden = true;
    show("This reset link is missing or invalid. Request a new reset email.", "error");
  }
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    if (password.length < 10 || password.length > 72) return show("Password must be 10–72 characters.", "error");
    if (password !== confirm) return show("The passwords do not match.", "error");
    if (API_BASE.includes("YOUR_DOMAIN.example")) return show("The site administrator must configure the API URL before this page can be used.", "error");
    submit.disabled = true;
    show("Updating password…", "");
    try {
      const response = await fetch(API_BASE.replace(/\\/+$/, "") + "/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ token, password })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || "Could not reset password.");
      form.hidden = true;
      show("Password updated. You can now return to Talviro Chat and sign in.", "success");
    } catch (error) {
      show(error.message || "Could not connect. Please try again.", "error");
      submit.disabled = false;
    }
  });
})();
</script>
</body>
</html>
